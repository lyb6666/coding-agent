[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent"
version = "0.1.0"
description = "一个手写的编程智能体（coding agent）"
requires-python = ">=3.11"
dependencies = ["openai>=1.40.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
coding = "coding_agent.cli:main"

[tool.setuptools]
packages = ["coding_agent"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
